services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: workos
      POSTGRES_USER: workos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
    volumes:
      - workos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U workos -d workos']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: ..
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      PORT: '10000'
      DATABASE_URL: postgres://workos:${POSTGRES_PASSWORD}@postgres:5432/workos
      ALLOW_DEV_LOGIN: 'false'
      SEED_DEMO: 'false'
      WORKOS_TEAM_MODE: company
      WORKOS_TEAM_NAME: OneLaser
    ports:
      - '127.0.0.1:${WORKOS_HTTP_PORT:-8088}:10000'
volumes:
  workos-postgres:
